name: Bug report
description: Report incorrect toolkit behavior or documentation.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Share the smallest useful reproduction. Remove credentials and private source.
  - type: input
    id: version
    attributes:
      label: Version and environment
      description: COD version or commit, runtime, operating system and affected command.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Steps and a minimal example, or the documentation section involved.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Include relevant output and whether a valid case was rejected or a bypass accepted.
    validations:
      required: true

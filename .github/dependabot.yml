version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
      semver-major-days: 30
      semver-minor-days: 1
      semver-patch-days: 1
    ignore:
      # Node declarations follow the minimum supported runtime (see threadlabs.config.json).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      compatible:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.1', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # Corepack owns the pnpm/Yarn shims; --force replaces runner-provided shims in this ephemeral job.
      - run: npm install --global --ignore-scripts --force corepack@0.34.7
      - run: corepack enable
      # pnpm's native bootstrap makes a single metadata request without retries.
      - name: Prepare pinned pnpm
        run: |
          for attempt in 1 2 3; do
            if pnpm --version; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          exit 1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Bootstrap declared toolkit dependencies
        run: node tools/setup.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:pr

  required:
    name: Required
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.verify.result }}" = success
